name: Android APK

# Builds an installable APK on every push to main and publishes it as the GitHub
# Release for the version in package.json (bump the version for a new release;
# pushing the same version again replaces that release's APK).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Download cry-detection model (YAMNet, Apache 2.0)
        run: scripts/get-model.sh modules/hush-native/android/src/main/assets/yamnet.tflite

      # Play upload key, from repo secrets. Without it the APK is debug-signed (fine
      # for sideloading) and no Play bundle is built.
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.HUSH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HUSH_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key secret; skipping Play bundle."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "HUSH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "HUSH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "HUSH_UPLOAD_KEY_ALIAS=hush"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Surface the real error as an annotation (readable without downloading logs).
            grep -E -A4 "^e: |What went wrong" build.log | grep -v "^--$" | head -9 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # Play bundle for every common phone CPU (Play delivers only the right one to
      # each phone, so the download stays small).
      - name: Build Play bundle (.aab)
        if: env.HUSH_UPLOAD_STORE_FILE != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      # Play rejects debug-signed bundles; fail here instead of at upload.
      - name: Check the bundle is signed with the upload key
        if: env.HUSH_UPLOAD_STORE_FILE != ''
        run: |
          SIGNER=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -m1 "Owner:")
          echo "$SIGNER"
          if echo "$SIGNER" | grep -q "CN=Android Debug"; then
            echo "::error::The Play bundle is signed with the debug key, not the upload key."
            exit 1
          fi

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/hush-${VERSION}.apk"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" "dist/hush-${VERSION}-play.aab"; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: hush-apk
          path: dist/*
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: hush ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Download the APK below on your Android phone and open it to install.
            If Android asks, allow your browser to install unknown apps.

      - name: Publish test build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.ref_name }}
          name: hush ${{ env.VERSION }} (${{ github.ref_name }} test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*
          body: Test build from the ${{ github.ref_name }} branch. Not the stable release.
