name: Android APK

# Builds an installable APK on every push to main and publishes it as the GitHub
# Release for the version in package.json (bump the version for a new release;
# pushing the same version again replaces that release's APK).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Download cry-detection model (YAMNet, Apache 2.0)
        run: |
          DEST=modules/hush-native/android/src/main/assets/yamnet.tflite
          mkdir -p "$(dirname "$DEST")"
          get() { curl -fsSL --retry 3 -o "$DEST" "$1" && [ "$(stat -c%s "$DEST")" -gt 1000000 ]; }
          get "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite" \
            || get "https://tfhub.dev/google/lite-model/yamnet/classification/tflite/1?lite-format=tflite" \
            || { curl -fsSL --retry 3 -o /tmp/yamnet.tgz "https://www.kaggle.com/api/v1/models/google/yamnet/tfLite/classification-tflite/1/download" \
                 && tar -xzf /tmp/yamnet.tgz -C /tmp && cp "$(ls /tmp/*.tflite | head -1)" "$DEST"; } \
            || { echo "::error::Could not download the YAMNet model"; exit 1; }
          echo "model size $(stat -c%s "$DEST")"
          # The detector reads classes by index; make sure they still mean what it expects.
          curl -fsSL --retry 3 -o /tmp/classes.csv https://raw.githubusercontent.com/tensorflow/models/master/research/audioset/yamnet/yamnet_class_map.csv
          check() { LINE=$(grep "^$1," /tmp/classes.csv); echo "class $1: $LINE"; echo "$LINE" | grep -q "$2" || { echo "::error::YAMNet class $1 is not '$2': $LINE"; exit 1; }; }
          check 0 "Speech"; check 1 "Child speech"; check 4 "Babbling"; check 13 "Laughter"; check 14 "Baby laughter"
          check 19 "Crying, sobbing"; check 20 "Baby cry, infant cry"; check 21 "Whimper"; check 22 "Wail, moan"; check 11 "Screaming"

      # Play upload key, from repo secrets. Without it the APK is debug-signed (fine
      # for sideloading) and no Play bundle is built.
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.HUSH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HUSH_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key secret; skipping Play bundle."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "HUSH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "HUSH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "HUSH_UPLOAD_KEY_ALIAS=hush"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Play bundle for every common phone CPU (Play delivers only the right one to
      # each phone, so the download stays small).
      - name: Build Play bundle (.aab)
        if: env.HUSH_UPLOAD_STORE_FILE != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/hush-${VERSION}.apk"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" "dist/hush-${VERSION}-play.aab"; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: hush-apk
          path: dist/*
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: hush ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Download the APK below on your Android phone and open it to install.
            If Android asks, allow your browser to install unknown apps.

      - name: Publish test build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.ref_name }}
          name: hush ${{ env.VERSION }} (${{ github.ref_name }} test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*
          body: Test build from the ${{ github.ref_name }} branch. Not the stable release.
