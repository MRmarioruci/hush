plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hushnative'
version = '1.1.0'

android {
  namespace "expo.modules.hushnative"
  defaultConfig {
    versionCode 2
    versionName "1.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  androidResources {
    noCompress "tflite"
  }
}

// expo-notifications ships as a prebuilt module; match the installed version.
def notificationsVersion() {
  def pkg = new File(rootDir, "../node_modules/expo-notifications/package.json")
  return new groovy.json.JsonSlurper().parse(pkg).version
}

dependencies {
  // On-device sound classifier for the cry detector (runs YAMNet).
  implementation "org.tensorflow:tensorflow-lite:2.16.1"
  // Push messages: hush extends expo-notifications' service to vibrate on crying alerts.
  // Both are already in the app; compile against them only.
  compileOnly "host.exp.exponent:expo.modules.notifications:${notificationsVersion()}"
  compileOnly 'com.google.firebase:firebase-messaging:25.0.1'
}
